name: Build VSIX

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YARN_IGNORE_ENGINES: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
